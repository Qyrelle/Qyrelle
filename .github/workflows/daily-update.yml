
name: QYRELLE Daily Release Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update music releases
        run: node scripts/update-releases.mjs

      - name: Save website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json music releases sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update music releases automatically"
            git push
          fi
