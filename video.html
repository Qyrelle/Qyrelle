<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicStream - Premium Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-container:hover .progress-handle {
            opacity: 1;
        }

        .visualizer-bar {
            transition: height 0.1s ease;
        }

        /* Custom scrollbar for playlist */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .album-art-pulse {
            animation: pulse-slow 4s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-4xl p-4 md:p-8 flex flex-col md:flex-row gap-8 items-center md:items-stretch">
        
        <!-- Left Section: Current Track & Controls -->
        <div class="glass-panel w-full md:w-3/5 rounded-[2rem] p-8 flex flex-col items-center">
            <div class="relative w-64 h-64 md:w-72 md:h-72 mb-8">
                <!-- Album Art -->
                <div class="absolute inset-0 bg-gradient-to-tr from-purple-500 to-blue-500 rounded-3xl album-art-pulse opacity-20 blur-2xl"></div>
                <img id="album-art" src="https://placehold.co/400x400/1e1b4b/6366f1?text=SonicStream" alt="Album Art" class="relative z-10 w-full h-full object-cover rounded-3xl shadow-2xl border border-white/10">
            </div>

            <!-- Track Info -->
            <div class="text-center mb-8 w-full">
                <h1 id="track-title" class="text-2xl font-bold truncate px-4">Welcome to SonicStream</h1>
                <p id="track-artist" class="text-slate-400 font-medium">Select or upload a song</p>
            </div>

            <!-- Progress Bar -->
            <div class="w-full mb-6">
                <div id="progress-container" class="relative h-1.5 w-full bg-white/10 rounded-full cursor-pointer group">
                    <div id="progress-fill" class="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-purple-500 rounded-full w-0"></div>
                    <div id="progress-handle" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg opacity-0 transition-opacity" style="left: 0%;"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-slate-500 font-medium">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Main Controls -->
            <div class="flex items-center gap-8">
                <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="ph-fill ph-skip-back text-3xl"></i>
                </button>
                
                <button onclick="togglePlay()" id="play-btn" class="w-16 h-16 bg-white text-slate-900 rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-xl">
                    <i id="play-icon" class="ph-fill ph-play text-3xl ml-1"></i>
                </button>

                <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="ph-fill ph-skip-forward text-3xl"></i>
                </button>
            </div>

            <!-- Additional Controls -->
            <div class="mt-8 flex items-center gap-6 w-full px-4">
                <div class="flex items-center gap-3 flex-1">
                    <i class="ph-fill ph-speaker-high text-slate-400 text-xl"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" class="w-full h-1 bg-white/10 rounded-full appearance-none accent-white cursor-pointer">
                </div>
                <button onclick="toggleShuffle()" id="shuffle-btn" class="text-slate-500 hover:text-white transition-colors">
                    <i class="ph-bold ph-shuffle text-xl"></i>
                </button>
                <button onclick="toggleLoop()" id="loop-btn" class="text-slate-500 hover:text-white transition-colors">
                    <i class="ph-bold ph-repeat text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Right Section: Playlist & Upload -->
        <div class="w-full md:w-2/5 flex flex-col gap-4">
            <!-- Upload Box -->
            <div class="glass-panel rounded-3xl p-6">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Add Your Songs</h3>
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-white/10 rounded-2xl cursor-pointer hover:bg-white/5 transition-colors group">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i class="ph-bold ph-cloud-arrow-up text-3xl text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                        <p class="text-xs text-slate-400 mt-2">Upload MP3 Files</p>
                    </div>
                    <input type="file" id="file-upload" class="hidden" accept="audio/*" multiple />
                </label>
            </div>

            <!-- Playlist -->
            <div class="glass-panel rounded-3xl p-6 flex-1 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Queue</h3>
                    <span id="queue-count" class="text-xs text-slate-500 font-mono">0 Tracks</span>
                </div>
                <div id="playlist-container" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-2">
                    <!-- Tracks will appear here -->
                    <div class="text-center py-10 opacity-30 italic text-sm">
                        Playlist is empty
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const albumArt = document.getElementById('album-art');
        const progressFill = document.getElementById('progress-fill');
        const progressHandle = document.getElementById('progress-handle');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume-slider');
        const playlistContainer = document.getElementById('playlist-container');
        const fileUpload = document.getElementById('file-upload');
        const queueCount = document.getElementById('queue-count');

        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isLoop = false;

        
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function loadTrack(index) {
            if (playlist.length === 0) return;
            
            const track = playlist[index];
            audio.src = track.url;
            trackTitle.innerText = track.name;
            trackArtist.innerText = track.artist || "Unknown Artist";
            
            // UI updates
            document.querySelectorAll('.track-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('bg-white/10', 'border-blue-500/50');
                    item.classList.remove('border-transparent');
                } else {
                    item.classList.remove('bg-white/10', 'border-blue-500/50');
                    item.classList.add('border-transparent');
                }
            });

            if (isPlaying) audio.play();
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            
            if (isPlaying) {
                audio.pause();
                playIcon.className = "ph-fill ph-play text-3xl ml-1";
            } else {
                audio.play();
                playIcon.className = "ph-fill ph-pause text-3xl ml-0";
            }
            isPlaying = !isPlaying;
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            }
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play();
        }


        fileUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                // Simple parsing for artist if file name is "Artist - Title.mp3"
                let name = file.name.replace(/\.[^/.]+$/, "");
                let artist = "Local File";
                
                if (name.includes(" - ")) {
                    const parts = name.split(" - ");
                    artist = parts[0];
                    name = parts[1];
                }

                playlist.push({ name, artist, url });
            });

            renderPlaylist();
            if (playlist.length > 0 && audio.src === "") {
                loadTrack(0);
            }
            queueCount.innerText = `${playlist.length} Tracks`;
        });

        function renderPlaylist() {
            if (playlist.length === 0) return;
            
            playlistContainer.innerHTML = playlist.map((track, index) => `
                <div onclick="selectTrack(${index})" class="track-item group flex items-center gap-4 p-3 rounded-xl border border-transparent hover:bg-white/5 cursor-pointer transition-all">
                    <div class="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center text-slate-500 group-hover:text-blue-400 transition-colors">
                        <i class="ph-bold ph-music-note"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate ${index === currentTrackIndex ? 'text-blue-400' : 'text-slate-200'}">${track.name}</p>
                        <p class="text-xs text-slate-500 truncate">${track.artist}</p>
                    </div>
                    <div class="text-[10px] font-mono text-slate-600">MP3</div>
                </div>
            `).join('');
        }

        function selectTrack(index) {
            currentTrackIndex = index;
            loadTrack(index);
            if (!isPlaying) togglePlay();
            else audio.play();
        }


        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            progressHandle.style.left = `${percent}%`;
            currentTimeEl.innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (isLoop) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').classList.toggle('text-blue-400', isShuffle);
        }

        function toggleLoop() {
            isLoop = !isLoop;
            document.getElementById('loop-btn').classList.toggle('text-blue-400', isLoop);
        }

        // Global hotkeys
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

    </script>
</body>
</html>
