<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicStream - Visualizer Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* The Spectrum Bars */
        .bar {
            width: 4px;
            background: linear-gradient(to top, #6366f1, #a855f7);
            border-radius: 10px;
            transition: height 0.05s ease;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

<div class="w-full max-w-4xl p-8 flex flex-col md:flex-row gap-8">
    <div class="glass-panel w-full md:w-3/5 rounded-[2rem] p-8 flex flex-col items-center">
        
        <div id="visualizer-container" class="relative w-64 h-64 flex items-end justify-center gap-1 mb-8">
            <img id="album-art" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ3bmZ3bmZ3/your-favorite-gif.gif" 
                 class="absolute inset-0 w-full h-full object-cover rounded-3xl z-10 transition-transform duration-75">
            
            <div id="spectrum" class="absolute bottom-[-20px] flex gap-1 h-20 items-end opacity-50">
                </div>
        </div>

        <div class="text-center mb-6">
            <h1 id="track-title" class="text-2xl font-bold">Ready to Rock</h1>
            <p id="track-artist" class="text-slate-400">Upload a song to see the magic</p>
        </div>

        <button onclick="togglePlay()" class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform">
            <i id="play-icon" class="ph-fill ph-play text-4xl"></i>
        </button>

        <input type="file" id="file-upload" class="mt-8 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-500 file:text-white hover:file:bg-blue-600" accept="audio/*">
    </div>
</div>

<audio id="audio-player"></audio>

<script>
    const audio = document.getElementById('audio-player');
    const albumArt = document.getElementById('album-art');
    const spectrumContainer = document.getElementById('spectrum');
    const fileUpload = document.getElementById('file-upload');
    
    let audioCtx, analyser, source, dataArray;

    // 1. Create the Spectrum Bars in HTML
    for (let i = 0; i < 32; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '5px';
        spectrumContainer.appendChild(bar);
    }
    const bars = document.querySelectorAll('.bar');

    // 2. Setup the "Brain" (Audio Context)
    function initVisualizer() {
        if (audioCtx) return; 
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64; 
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animate();
    }

    // 3. The Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        if (!analyser) return;

        analyser.getByteFrequencyData(dataArray);

        dataArray.forEach((value, i) => {
            if (bars[i]) {
                const height = (value / 255) * 100;
                bars[i].style.height = `${height}px`;
            }
        });

        // BEAT BOUNCE LOGIC
        // We look at the low frequencies (bass) at index 0-2
        const bassValue = dataArray[1];
        const scale = 1 + (bassValue / 500); // Slight grow based on bass
        albumArt.style.transform = `scale(${scale})`;
    }

    function togglePlay() {
        if (!audio.src) return;
        initVisualizer(); // Initialize on first play
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        if (audio.paused) {
            audio.play();
            document.getElementById('play-icon').className = "ph-fill ph-pause text-4xl";
        } else {
            audio.pause();
            document.getElementById('play-icon').className = "ph-fill ph-play text-4xl";
        }
    }

    fileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            audio.src = URL.createObjectURL(file);
            document.getElementById('track-title').innerText = file.name;
        }
    });
</script>

</body>
</html>
