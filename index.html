<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrelle | Official Hub</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; margin: 40px 0; }
        header h1 { font-size: 3rem; letter-spacing: 4px; text-transform: none; color: var(--text-color); text-shadow: 0 0 10px var(--accent-color); }
        header p { color: var(--text-dim); margin-top: 10px; font-size: 1.1rem; }

        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 40px; }
        .section-title { font-size: 1.5rem; text-transform: none; letter-spacing: 2px; margin-bottom: 20px; border-left: 4px solid var(--accent-color); padding-left: 10px; }

        .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 768px) { .media-grid { grid-template-columns: 1fr; } }

        .player-card { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
        }
        
        .card-label { margin-bottom: 15px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .platforms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .platform-card { background: var(--panel-bg); border: 1px solid #222; border-radius: 12px; padding: 25px; text-align: center; text-decoration: none; color: var(--text-color); font-weight: bold; transition: all 0.3s ease; }
        .platform-card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
        
        footer { text-align: center; margin: 60px 0 20px 0; color: var(--text-dim); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>Qyrelle</h1>
        <p>Phonk Producer & Visual Artist</p>
    </header>

    <div class="container">
        <section>
            <h2 class="section-title">Latest Drops & Visuals</h2>
            <div class="media-grid">
                
                <!-- YouTube Automated Uploads Feed -->
                <div class="player-card">
                    <div class="card-label">Latest Video</div>
                    <div class="video-container">
                        <!-- Pulls your live upload feed cleanly from your Channel ID string -->
                        <iframe src="https://www.youtube.com/embed/videoseries?list=UUr47-AbMd0j0IUnf0i8HVmg" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Spotify Automated Card -->
                <div class="player-card">
                    <div class="card-label">Stream on Spotify</div>
                    <iframe style="border-radius:8px" src="https://open.spotify.com/embed/artist/6kBTv9IdI3A3OshhpkheBM?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>

            </div>
        </section>

        <section>
            <h2 class="section-title">Listen Everywhere</h2>
            <div class="platforms-grid">
                <a href="https://open.spotify.com/artist/6kBTv9IdI3A3OshhpkheBM" target="_blank" class="platform-card">🟢 Spotify</a>
                <a href="https://music.apple.com/in/artist/qyrelle/1887495171" target="_blank" class="platform-card">🍎 Apple Music</a>
                <a href="https://soundcloud.com/qyrelle" target="_blank" class="platform-card">☁️ SoundCloud</a>
                <a href="https://music.amazon.in/artists/B0GX5YRWQV/qyrelle" target="_blank" class="platform-card">💧 Amazon Music</a>
            </div>
        </section>
    </div>

    <footer><p>&copy; 2026 Qyrelle. All Rights Reserved.</p></footer>
</body>
</html>
