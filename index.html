<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qyrelle | Official Hub</title>
    
    <!-- Tab Icon -->
    <link rel="icon" type="image/jpeg" href="https://unavatar.io/youtube/qyrelle">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh; /* Forces exact screen height */
            width: 100vw;
            overflow: hidden; /* Blocks all page-level up/down scrolling */
        }

        header { 
            text-align: center; 
            margin: 10px 0; 
        }
        header h1 { 
            font-size: 2.2rem; 
            letter-spacing: 3px; 
            text-transform: none; 
            color: var(--text-color); 
            text-shadow: 0 0 10px var(--accent-color); 
        }
        header p { 
            color: var(--text-dim); 
            margin-top: 5px; 
            font-size: 0.95rem; 
        }

        .container { 
            width: 100%; 
            max-width: 950px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            flex-grow: 1;
            justify-content: center;
        }

        .section-title { 
            font-size: 1.1rem; 
            text-transform: none; 
            letter-spacing: 1px; 
            margin-bottom: 10px; 
            border-left: 3px solid var(--accent-color); 
            padding-left: 8px; 
        }

        /* Responsive Media Section Layout */
        .media-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        .player-card { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
        }
        
        .card-label { margin-bottom: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 8px;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Smooth responsive platforms dashboard layout grid */
        .platforms-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
        }
        .platform-card { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
            border-radius: 10px; 
            padding: 15px 5px; 
            text-align: center; 
            text-decoration: none; 
            color: var(--text-color); 
            font-weight: bold; 
            font-size: 0.95rem;
            transition: all 0.3s ease; 
            white-space: nowrap;
        }
        .platform-card:hover { transform: translateY(-3px); border-color: var(--accent-color); box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        
        footer { 
            text-align: center; 
            margin-top: 10px;
            color: var(--text-dim); 
            font-size: 0.8rem; 
        }

        /* Responsive mobile adjustments to stay perfectly inside 1 frame */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .media-grid { grid-template-columns: 1fr; gap: 10px; }
            .platforms-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .spotify-player { height: 180px !important; } /* Compact player view on phones */
            .platform-card { padding: 12px 5px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Qyrelle</h1>
        <p>Phonk Producer & Visual Artist</p>
    </header>

    <div class="container">
        <section>
            <h2 class="section-title">Latest Drops & Visuals</h2>
            <div class="media-grid">
                
                <!-- YouTube Playlist Card -->
                <div class="player-card">
                    <div class="card-label">Latest Videos</div>
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/videoseries?list=PLe-JhuYacKzo" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Spotify Automated Card -->
                <div class="player-card">
                    <div class="card-label">Stream on Spotify</div>
                    <iframe class="spotify-player" src="https://open.spotify.com/embed/artist/6kBTv9IdI3A3OshhpkheBM" width="100%" height="240" frameborder="0" allowtransparency="true" allow="encrypted-media" style="border-radius:8px;"></iframe>
                </div>

            </div>
        </section>

        <section>
            <h2 class="section-title">Listen Everywhere</h2>
            <div class="platforms-grid">
                <a href="https://open.spotify.com/artist/6kBTv9IdI3A3OshhpkheBM" target="_blank" class="platform-card">🟢 Spotify</a>
                <a href="https://music.apple.com/in/artist/qyrelle/1887495171" target="_blank" class="platform-card">🍎 Apple Music</a>
                <a href="https://soundcloud.com/qyrelle" target="_blank" class="platform-card">☁️ SoundCloud</a>
                <a href="https://music.amazon.in/artists/B0GX5YRWQV/qyrelle" target="_blank" class="platform-card">💧 Amazon Music</a>
            </div>
        </section>
    </div>

    <footer><p>&copy; 2026 Qyrelle. All Rights Reserved.</p></footer>
</body>
</html>
