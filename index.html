<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrelle | Official Hub</title>
    
    <!-- Tab Icon -->
    <link rel="icon" type="image/jpeg" href="https://unavatar.io/youtube/qyrelle">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header { 
            text-align: center; 
            margin: 20px 0; 
        }
        header h1 { 
            font-size: 2.8rem; 
            letter-spacing: 4px; 
            text-transform: none; 
            color: var(--text-color); 
            text-shadow: 0 0 10px var(--accent-color); 
        }
        header p { 
            color: var(--text-dim); 
            margin-top: 8px; 
            font-size: 1.05rem; 
        }

        .container { 
            width: 100%; 
            max-width: 1000px; 
            display: flex; 
            flex-direction: column; 
            gap: 30px;
            flex-grow: 1;
        }

        .section-title { 
            font-size: 1.3rem; 
            text-transform: none; 
            letter-spacing: 1px; 
            margin-bottom: 15px; 
            border-left: 3px solid var(--accent-color); 
            padding-left: 10px; 
        }

        /* Fluid layout: Side-by-side on desktop, stacked vertical feed on mobile phones */
        .media-grid { 
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        .player-card { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card-label { margin-bottom: 15px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 8px;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Dynamic Grid for Streaming Links */
        .platforms-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-bottom: 30px;
        }
        .platform-card { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 20px 10px; 
            text-align: center; 
            text-decoration: none; 
            color: var(--text-color); 
            font-weight: bold; 
            font-size: 1rem;
            transition: all 0.3s ease; 
        }
        .platform-card:hover { transform: translateY(-4px); border-color: var(--accent-color); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
        
        footer { 
            text-align: center; 
            margin-top: auto;
            padding-top: 20px;
            color: var(--text-dim); 
            font-size: 0.85rem; 
        }

        /* AUTO-ADJUST SPECIFICALLY FOR MOBILE PHONES */
        @media (max-width: 768px) {
            body { padding: 15px; }
            header h1 { font-size: 2.2rem; }
            header p { font-size: 0.95rem; }
            
            /* Stacks layout vertically so it fills mobile perfectly without squishing */
            .media-grid { flex-direction: column; gap: 15px; }
            .platforms-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            
            .platform-card { padding: 15px 5px; font-size: 0.9rem; }
            .spotify-iframe { height: 352px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Qyrelle</h1>
        <p>Phonk Producer & Visual Artist</p>
    </header>

    <div class="container">
        <section>
            <h2 class="section-title">Latest Drops & Visuals</h2>
            <div class="media-grid">
                
                <!-- YouTube Playlist Card -->
                <div class="player-card">
                    <div class="card-label">Latest Videos</div>
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/videoseries?list=PLe-JhuYacKzo" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Spotify Automated Card -->
                <div class="player-card">
                    <div class="card-label">Stream on Spotify</div>
                    <iframe class="spotify-iframe" src="https://open.spotify.com/embed/artist/6kBTv9IdI3A3OshhpkheBM" width="100%" height="100%" min-height="352" frameborder="0" allowtransparency="true" allow="encrypted-media" style="border-radius:12px; min-height: 280px;"></iframe>
                </div>

            </div>
        </section>

        <section>
            <h2 class="section-title">Listen Everywhere</h2>
            <div class="platforms-grid">
                <a href="https://open.spotify.com/artist/6kBTv9IdI3A3OshhpkheBM" target="_blank" class="platform-card">ᯤ Spotify</a>
                <a href="https://music.apple.com/in/artist/qyrelle/1887495171" target="_blank" class="platform-card">♫ Apple Music</a>
                <a href="https://soundcloud.com/qyrelle" target="_blank" class="platform-card">☁️ SoundCloud</a>
                <a href="https://music.amazon.in/artists/B0GX5YRWQV/qyrelle" target="_blank" class="platform-card">‿ Amazon Music</a>
            </div>
        </section>
    </div>

    <footer><p>&copy; 2026 Qyrelle. All Rights Reserved.</p></footer>
</body>
</html>
